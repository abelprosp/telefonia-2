# Rate limits use the peer address; this file is included in the nginx http context.
limit_req_zone $binary_remote_addr zone=connect_api_rate:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=connect_login_rate:10m rate=5r/s;

# TLS em /etc/nginx/ssl (fullchain.pem + privkey.pem).
# /auth → Keycloak; /api → API Go (prefixo removido: /api/v1/... → upstream /v1/...).
upstream connect_api {
    server connect-api:80;
}

upstream keycloak_internal {
    server keycloak:8080;
}

server {
    listen 80;
    server_name telefonia.redobrai.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_name telefonia.redobrai.online;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /auth {
        return 301 /auth/;
    }

    location /auth/ {
        limit_req zone=connect_login_rate burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 2M;
        proxy_pass http://keycloak_internal/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_redirect off;
    }

    location /realms/ {
        limit_req zone=connect_login_rate burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 2M;
        proxy_pass http://keycloak_internal/auth/realms/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_redirect off;
    }

    location = /api/v1/intake/customers {
        limit_req zone=connect_api_rate burst=8 nodelay;
        limit_req_status 429;
        client_max_body_size 24M;
        proxy_pass http://connect_api/v1/intake/customers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 100s;
    }

    location = /api/v1/customers {
        limit_req zone=connect_api_rate burst=8 nodelay;
        limit_req_status 429;
        client_max_body_size 24M;
        proxy_pass http://connect_api/v1/customers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 100s;
    }

    location /api/ {
        limit_req zone=connect_api_rate burst=40 nodelay;
        limit_req_status 429;
        client_max_body_size 2M;
        proxy_pass http://connect_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
