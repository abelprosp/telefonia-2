# Produção na VPS Hostinger (telefonia.redobrai.online).
# O nginx do Ubuntu escuta 80/443 e faz proxy para:
#   web :3005  |  API :8010  |  Keycloak :8083  |  MinIO :19000
# Não publicar 80/443 nos contentores — senão o web não sobe e o host devolve 502.

services:
  rabbitmq:
    image: ${RABBITMQ_IMAGE:?Defina a imagem RabbitMQ com digest sha256}
    ports: !override []
    healthcheck:
      test: ['CMD-SHELL', 'rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity']
      interval: 1s
      retries: 20

  postgres:
    image: ${POSTGRES_IMAGE:?Defina a imagem Postgres com digest sha256}
    ports: !override []
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-luxus_connect_dev}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-luxus_connect_dev}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: on-failure

  seq:
    ports: !override []

  minio:
    image: ${MINIO_IMAGE:?Defina a imagem MinIO corrigida com digest sha256}
    container_name: minio.connect.luxus
    ports:
      - '127.0.0.1:19000:9000'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Defina o usuario root do MinIO}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Defina a senha root do MinIO}
      MINIO_API_CORS_ALLOW_ORIGIN: ${PUBLIC_ORIGIN:?Defina a origem HTTPS publica}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: on-failure

  minio-init:
    image: ${MINIO_MC_IMAGE:?Defina a imagem mc com digest sha256}
    container_name: minio-init.connect.luxus
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Defina o usuario root do MinIO}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Defina a senha root do MinIO}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:?Defina a chave da aplicacao}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:?Defina o segredo da aplicacao}
      OBJECT_STORAGE_BUCKET_NAME: ${OBJECT_STORAGE_BUCKET_NAME:-luxus-connect}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Defina a origem HTTPS publica}
    volumes:
      - ./docker/minio/init.sh:/opt/connect/init.sh:ro
    entrypoint: ['/bin/sh', '/opt/connect/init.sh']
    restart: 'no'

  keycloak:
    image: ${KEYCLOAK_IMAGE:?Defina a imagem Keycloak com digest sha256}
    volumes:
      - ./docker/keycloak/luxus-realm.prod.json:/opt/keycloak/data/import/luxus-realm.json:ro
    entrypoint:
      - /opt/keycloak/bin/kc.sh
      - start
      - --import-realm
      - --spi-theme-static-max-age=-1
      - --spi-theme-cache-themes=false
      - --spi-theme-cache-templates=false
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    environment:
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN:?Defina a origem HTTPS publica}
      - KC_HTTP_RELATIVE_PATH=/auth
      - KC_HTTP_ENABLED=true
      - KC_SPI_REQUIRED_ACTION__UPDATE_PASSWORD__MAX_AUTH_AGE=0
      - KC_PROXY_HEADERS=xforwarded
      - KC_HOSTNAME=${PUBLIC_ORIGIN:?Defina a origem HTTPS publica}/auth
      - KC_HOSTNAME_ADMIN=${PUBLIC_ORIGIN:?Defina a origem HTTPS publica}/auth
      - KC_HOSTNAME_URL=${PUBLIC_ORIGIN:?Defina a origem HTTPS publica}/auth
      - KC_HOSTNAME_ADMIN_URL=${PUBLIC_ORIGIN:?Defina a origem HTTPS publica}/auth
      - KC_HOSTNAME_STRICT=true
    ports: !override
      - '127.0.0.1:8083:8080'
    restart: on-failure

  connect-api:
    environment:
      - TELEFONIA_INTAKE_API_KEY=${TELEFONIA_INTAKE_API_KEY:-}
      - TELEFONIA_INTAKE_ORG_ID=${TELEFONIA_INTAKE_ORG_ID:-}
      - ENVIRONMENT=Production
      - PORT=80
      - DATABASE_URL=Host=postgres;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=${POSTGRES_DB:-luxus_connect_dev};
      - RABBITMQ_URL=amqp://${RMQ_USER}:${RMQ_PWD}@rabbitmq:5672
      - KEYCLOAK_REALM=luxus
      - KEYCLOAK_AUTH_SERVER_URL=http://keycloak:8080/auth
      - KEYCLOAK_PUBLIC_AUTH_SERVER_URL=${PUBLIC_ORIGIN:?Defina a origem HTTPS publica}/auth
      - KEYCLOAK_RESOURCE=connect-cli
      - KEYCLOAK_ADMIN_USERNAME=${KC_ADMIN_USERNAME:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KC_ADMIN_PWD}
      - OBJECT_STORAGE_SERVICE_URL=http://minio:9000
      - OBJECT_STORAGE_PUBLIC_URL=${PUBLIC_ORIGIN:?Defina a origem HTTPS publica}
      - OBJECT_STORAGE_ACCESS_KEY_ID=${OBJECT_STORAGE_ACCESS_KEY_ID:?Defina a chave da aplicacao}
      - OBJECT_STORAGE_SECRET_ACCESS_KEY=${OBJECT_STORAGE_SECRET_ACCESS_KEY:?Defina o segredo da aplicacao}
      - OBJECT_STORAGE_BUCKET_NAME=${OBJECT_STORAGE_BUCKET_NAME:-luxus-connect}
      - CORS_ORIGINS=${PUBLIC_ORIGIN:?Defina a origem HTTPS publica}
      - SICREDI_ENABLED=${SICREDI_ENABLED:-false}
      - SICREDI_SANDBOX=${SICREDI_SANDBOX:-false}
      - SICREDI_API_KEY=${SICREDI_API_KEY:-}
      - SICREDI_USERNAME=${SICREDI_USERNAME:-}
      - SICREDI_PASSWORD=${SICREDI_PASSWORD:-}
      - SICREDI_COOPERATIVA=${SICREDI_COOPERATIVA:-}
      - SICREDI_POSTO=${SICREDI_POSTO:-}
      - SICREDI_CODIGO_BENEFICIARIO=${SICREDI_CODIGO_BENEFICIARIO:-}
      - SICREDI_PUBLIC_API_URL=${SICREDI_PUBLIC_API_URL:-}
      - SICREDI_WEBHOOK_TOKEN=${SICREDI_WEBHOOK_TOKEN:-}
      - FINANCIAL_AGENT_API_KEY=${FINANCIAL_AGENT_API_KEY:-}
      - FINANCIAL_AGENT_ORG_ID=${FINANCIAL_AGENT_ORG_ID:-}
      - FINANCIAL_AGENT_PUBLIC_URL=${FINANCIAL_AGENT_PUBLIC_URL:-${PUBLIC_ORIGIN:?Defina a origem HTTPS publica}/api}
      - PARCEIROS_INTAKE_API_KEY=${PARCEIROS_INTAKE_API_KEY:-}
      - PARCEIROS_INTAKE_ORG_ID=${PARCEIROS_INTAKE_ORG_ID:-}
      - PARCEIROS_UPLOAD_DIR=/var/lib/parceiros-uploads
      - ZAPSIGN_API_TOKEN=${ZAPSIGN_API_TOKEN:-}
      - ZAPSIGN_BASE_URL=${ZAPSIGN_BASE_URL:-}
      - ZAPSIGN_SANDBOX=${ZAPSIGN_SANDBOX:-false}
      - ZAPSIGN_WEBHOOK_TOKEN=${ZAPSIGN_WEBHOOK_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      rabbitmq:
        condition: service_healthy
        restart: true
      keycloak:
        condition: service_started
        restart: true
      minio-init:
        condition: service_completed_successfully
    restart: on-failure
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:80/health >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - parceiros-uploads:/var/lib/parceiros-uploads
    ports: !override
      - '127.0.0.1:8010:80'

  connect-web:
    build:
      context: ./src/Luxus.Connect.Web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${PUBLIC_ORIGIN:?Defina a origem HTTPS publica}/api
        VITE_AUTH_URL: ${PUBLIC_ORIGIN:?Defina a origem HTTPS publica}/auth
        VITE_CLIENT_ID: connect-cli
        VITE_STORAGE_BUCKET_NAME: ${OBJECT_STORAGE_BUCKET_NAME:-luxus-connect}
    ports:
      - '127.0.0.1:3005:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:80/']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: on-failure

volumes:
  minio-data:
    name: connect.luxus.minio-data
  parceiros-uploads:
    name: connect.luxus.parceiros-uploads
