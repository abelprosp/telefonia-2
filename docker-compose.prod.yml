# Produção na VPS Hostinger (telefonia.redobrai.online).
# O nginx do Ubuntu escuta 80/443 e faz proxy para:
#   web :3005  |  API :8010  |  Keycloak :8083  |  MinIO :19000
# Não publicar 80/443 nos contentores — senão o web não sobe e o host devolve 502.

services:
  rabbitmq:
    ports: !override []
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 1s
      retries: 20

  postgres:
    ports: !override []
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d luxus_connect_dev']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: on-failure

  seq:
    ports: !override []

  minio:
    image: quay.io/minio/minio:latest
    container_name: minio.connect.luxus
    ports:
      - '127.0.0.1:19000:9000'
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: on-failure

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: minio-init.connect.luxus
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-minioadmin}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb local/luxus-connect --ignore-existing;
      echo '[{\"AllowedOrigin\":[\"*\"],\"AllowedMethod\":[\"GET\",\"PUT\",\"POST\",\"DELETE\",\"HEAD\"],\"AllowedHeader\":[\"*\"],\"ExposeHeader\":[\"ETag\"],\"MaxAgeSeconds\":3000}]' > /tmp/cors.json;
      mc cors set local/luxus-connect /tmp/cors.json || true;
      exit 0;
      "
    restart: 'no'

  keycloak:
    entrypoint:
      - /opt/keycloak/bin/kc.sh
      - start
      - --import-realm
      - --spi-theme-static-max-age=-1
      - --spi-theme-cache-themes=false
      - --spi-theme-cache-templates=false
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    environment:
      - KC_HTTP_RELATIVE_PATH=/auth
      - KC_HTTP_ENABLED=true
      - KC_PROXY_HEADERS=xforwarded
      - KC_HOSTNAME=https://telefonia.redobrai.online/auth
      - KC_HOSTNAME_ADMIN=https://telefonia.redobrai.online/auth
      - KC_HOSTNAME_URL=https://telefonia.redobrai.online/auth
      - KC_HOSTNAME_ADMIN_URL=https://telefonia.redobrai.online/auth
      - KC_HOSTNAME_STRICT=false
    ports:
      - !override '127.0.0.1:8083:8080'
    restart: on-failure

  connect-api:
    environment:
      - ENVIRONMENT=Production
      - PORT=80
      - DATABASE_URL=Host=postgres;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=luxus_connect_dev;
      - RABBITMQ_URL=amqp://${RMQ_USER}:${RMQ_PWD}@rabbitmq:5672
      - KEYCLOAK_REALM=luxus
      - KEYCLOAK_AUTH_SERVER_URL=http://keycloak:8080/auth
      - KEYCLOAK_PUBLIC_AUTH_SERVER_URL=https://telefonia.redobrai.online/auth
      - KEYCLOAK_RESOURCE=connect-cli
      - KEYCLOAK_ADMIN_USERNAME=${KC_ADMIN_USERNAME:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KC_ADMIN_PWD}
      - OBJECT_STORAGE_SERVICE_URL=http://minio:9000
      - OBJECT_STORAGE_PUBLIC_URL=https://telefonia.redobrai.online
      - OBJECT_STORAGE_ACCESS_KEY_ID=${OBJECT_STORAGE_ACCESS_KEY_ID:-minioadmin}
      - OBJECT_STORAGE_SECRET_ACCESS_KEY=${OBJECT_STORAGE_SECRET_ACCESS_KEY:-minioadmin}
      - CORS_ORIGINS=https://telefonia.redobrai.online
      - SICREDI_ENABLED=${SICREDI_ENABLED:-false}
      - SICREDI_SANDBOX=${SICREDI_SANDBOX:-false}
      - SICREDI_API_KEY=${SICREDI_API_KEY:-}
      - SICREDI_USERNAME=${SICREDI_USERNAME:-}
      - SICREDI_PASSWORD=${SICREDI_PASSWORD:-}
      - SICREDI_COOPERATIVA=${SICREDI_COOPERATIVA:-}
      - SICREDI_POSTO=${SICREDI_POSTO:-}
      - SICREDI_CODIGO_BENEFICIARIO=${SICREDI_CODIGO_BENEFICIARIO:-}
      - SICREDI_PUBLIC_API_URL=${SICREDI_PUBLIC_API_URL:-}
      - SICREDI_WEBHOOK_TOKEN=${SICREDI_WEBHOOK_TOKEN:-}
      - FINANCIAL_AGENT_API_KEY=${FINANCIAL_AGENT_API_KEY:-}
      - FINANCIAL_AGENT_ORG_ID=${FINANCIAL_AGENT_ORG_ID:-}
      - FINANCIAL_AGENT_PUBLIC_URL=${FINANCIAL_AGENT_PUBLIC_URL:-https://telefonia.redobrai.online/api}
      - ZAPSIGN_API_TOKEN=${ZAPSIGN_API_TOKEN:-}
      - ZAPSIGN_BASE_URL=${ZAPSIGN_BASE_URL:-}
      - ZAPSIGN_SANDBOX=${ZAPSIGN_SANDBOX:-false}
      - ZAPSIGN_WEBHOOK_TOKEN=${ZAPSIGN_WEBHOOK_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      rabbitmq:
        condition: service_started
        restart: true
      keycloak:
        condition: service_started
        restart: true
      minio:
        condition: service_healthy
        restart: true
    restart: on-failure
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:80/health >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - !override '127.0.0.1:8010:80'

  connect-web:
    build:
      context: ./src/Luxus.Connect.Web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://telefonia.redobrai.online/api
        VITE_AUTH_URL: https://telefonia.redobrai.online/auth
        VITE_CLIENT_ID: connect-cli
        VITE_STORAGE_BUCKET_NAME: luxus-connect
    ports:
      - '127.0.0.1:3005:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:80/']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: on-failure

volumes:
  minio-data:
    name: connect.luxus.minio-data
